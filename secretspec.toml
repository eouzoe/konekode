[project]
name = "cp-site"
revision = "1.0"
require_reason = false

[profiles.default]
CLOUDFLARE_API_TOKEN = { description = "Cloudflare API token for alchemy deploy, scoped to this account", providers = [
  "gstack",
] }
CLOUDFLARE_ACCOUNT_ID = { description = "Cloudflare account that holds the site", providers = [
  "gstack",
] }
KONEKODE_PREVIEW_VIEWER = { description = "The one address Access lets into preview stages", required = false, providers = [
  "gstack",
] }

KONEKODE_CHECK_CLIENT_ID = { description = "Access service token id the deploy checks use on preview stages", required = false, providers = [
  "gstack",
] }
KONEKODE_CHECK_CLIENT_SECRET = { description = "Access service token secret the deploy checks use on preview stages", required = false, providers = [
  "gstack",
] }
