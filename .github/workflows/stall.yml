name: 量測：下載編譯器時主執行緒的空檔

on:
  push:
    branches: ['exp/**']

permissions:
  contents: read

jobs:
  build:
    name: 建置
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c
      - run: nix profile install nixpkgs#devenv
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            node_modules/.cache/parts
            node_modules/.cache/packed-assets
          key: compiler-parts-${{ hashFiles('bun.lock') }}
      - run: devenv shell -- just build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 3

  measure-nix:
    name: 量測（${{ matrix.os }}，${{ matrix.browser }}）
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        browser: [webkit, chromium]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c
      - run: nix profile install nixpkgs#devenv
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist
          path: dist
      - name: 下載編譯器
        continue-on-error: true
        env:
          BLOCK: '0'
        run: devenv shell -- just e2e-run e2e/stall.probe.test.ts --project=${{ matrix.browser }} --repeat-each=4 --trace off
      - name: 擋掉編譯器
        continue-on-error: true
        env:
          BLOCK: '1'
        run: devenv shell -- just e2e-run e2e/stall.probe.test.ts --project=${{ matrix.browser }} --repeat-each=4 --trace off

  measure-windows:
    name: 量測（windows-latest，${{ matrix.browser }}）
    needs: build
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun x playwright install ${{ matrix.browser }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist
          path: dist
      - name: 下載編譯器
        continue-on-error: true
        env:
          BLOCK: '0'
        run: bun x playwright test e2e/stall.probe.test.ts --project=${{ matrix.browser }} --repeat-each=4 --trace off
      - name: 擋掉編譯器
        continue-on-error: true
        env:
          BLOCK: '1'
        run: bun x playwright test e2e/stall.probe.test.ts --project=${{ matrix.browser }} --repeat-each=4 --trace off
