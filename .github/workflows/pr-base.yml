name: 合併請求的目標分支

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  base:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    if: github.base_ref != 'dev' && !(github.base_ref == 'main' && github.head_ref == 'dev')
    steps:
      - name: 目標分支不對
        run: |
          echo "::error::這個版本庫的合併請求請以 dev 為目標分支；main 只接受從 dev 來的發布。請把目標分支改成 dev。"
          exit 1
