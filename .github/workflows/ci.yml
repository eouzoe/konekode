name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 檢查與建置
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - run: nix profile install nixpkgs#devenv
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/packed-assets
          key: packed-assets-${{ hashFiles('bun.lock') }}
      - run: devenv shell -- just check
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 3

  e2e-nix:
    name: 端到端（${{ matrix.os }}，${{ matrix.browser }}）
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - run: nix profile install nixpkgs#devenv
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: devenv shell -- just e2e-run --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-${{ matrix.os }}-${{ matrix.browser }}
          path: test-results
          retention-days: 7

  e2e-windows:
    name: 端到端（windows-latest，${{ matrix.browser }}）
    needs: check
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun x playwright install ${{ matrix.browser }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: bun x playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-windows-${{ matrix.browser }}
          path: test-results
          retention-days: 7

  deploy:
    name: 部署
    needs: [e2e-nix, e2e-windows]
    if: github.event_name == 'push' && vars.DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: bun x wrangler deploy --name ${{ github.ref_name == 'main' && 'cp' || 'cp-dev' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
