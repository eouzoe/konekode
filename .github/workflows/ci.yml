name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 檢查與建置
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      full: ${{ steps.tier.outputs.full }}
    steps:
      - id: tier
        run: echo "full=${{ github.ref_name == 'main' || github.base_ref == 'main' || github.event_name == 'workflow_dispatch' }}" >> "$GITHUB_OUTPUT"
      - name: actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: nixbuild/nix-quick-install-action v35
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c
      - run: nix profile install nixpkgs#devenv
      - name: actions/cache v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: node_modules/.cache/packed-assets
          key: packed-assets-${{ hashFiles('bun.lock') }}
      - run: devenv shell -- just check
        env:
          PUBLIC_INDEX: ${{ github.ref_name == 'main' }}
      - name: actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 3

  e2e-fast:
    name: 端到端（ubuntu，chromium）
    needs: check
    if: needs.check.outputs.full != 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: nixbuild/nix-quick-install-action v35
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c
      - run: nix profile install nixpkgs#devenv
      - name: actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist
          path: dist
      - run: devenv shell -- just e2e-run --project=chromium
      - name: actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: e2e-fast
          path: test-results
          retention-days: 7

  e2e-nix:
    name: 端到端（${{ matrix.os }}，${{ matrix.browser }}，${{ matrix.shard }}）
    needs: check
    if: needs.check.outputs.full == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest]
        browser: [chromium, firefox, webkit]
        shard: [1/2, 2/2]
    steps:
      - name: actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: nixbuild/nix-quick-install-action v35
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c
      - run: nix profile install nixpkgs#devenv
      - name: actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist
          path: dist
      - run: devenv shell -- just e2e-run --project=${{ matrix.browser }} --shard=${{ matrix.shard }}
      - name: actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: e2e-${{ matrix.os }}-${{ matrix.browser }}-${{ strategy.job-index }}
          path: test-results
          retention-days: 7

  e2e-windows:
    name: 端到端（windows-latest，${{ matrix.browser }}，${{ matrix.shard }}）
    needs: check
    if: needs.check.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1/2, 2/2]
    steps:
      - name: actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: oven-sh/setup-bun v2.2.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun x playwright install ${{ matrix.browser }}
      - name: actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist
          path: dist
      - run: bun x playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}
      - name: actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: e2e-windows-${{ matrix.browser }}-${{ strategy.job-index }}
          path: test-results
          retention-days: 7

  deploy:
    name: 部署
    needs: [e2e-nix, e2e-windows]
    if: github.event_name == 'push' && github.ref_name == 'main' && vars.DEPLOY == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: production
    steps:
      - name: actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: oven-sh/setup-bun v2.2.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist
          path: dist
      - run: bun x wrangler deploy --name cp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
